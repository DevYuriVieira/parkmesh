name: ParkMesh CI

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ParkMesh.sln

      - name: Build solution
        run: dotnet build ParkMesh.sln -c Release --no-restore

      - name: Validate Docker Compose configuration
        run: docker compose -f infra/docker-compose.yml --profile full config --quiet

      - name: Run unit tests
        run: dotnet test tests/ParkMesh.UnitTests/ParkMesh.UnitTests.csproj -c Release --no-build --verbosity normal

      - name: Run full integration suite (API, OpenAPI, SignalR, Testcontainers Redis & Postgres)
        run: dotnet test tests/ParkMesh.IntegrationTests/ParkMesh.IntegrationTests.csproj -c Release --no-build --verbosity normal
